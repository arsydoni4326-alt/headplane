# Lighthouse CI config for Headplane.
#
# The login page is public and does not call Headscale on load, so it can be
# measured without a live Headscale. Authenticated routes require a session and
# are covered by the Playwright e2e suite and the bundle-size analysis instead.
server:
  host: "127.0.0.1"
  port: 3101
  base_url: "http://127.0.0.1:3101"
  data_path: "/tmp/headplane-lighthouse"
  cookie_secret: "0123456789abcdef0123456789abcdef"
  cookie_secure: false
headscale:
  url: "http://127.0.0.1:59999"
